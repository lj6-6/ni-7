<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>待办清单 + 番茄钟</title>
  <style>
    :root {
      --bg: #f6f7f3;
      --text: #1f2428;
      --muted: #65717b;
      --line: #d8ded6;
      --panel: #ffffff;
      --primary: #176b5b;
      --primary-dark: #0e4f43;
      --accent: #c05a2b;
      --soft: #e8f1ee;
      --done: #7b8790;
      font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1, h2, p { margin: 0; }

    h1 {
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    h2 {
      font-size: 18px;
      line-height: 1.3;
      margin-bottom: 14px;
    }

    .date {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.75fr);
      gap: 18px;
      align-items: start;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    .add-row,
    .controls,
    .timer-actions,
    .settings,
    .stats {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    input,
    button {
      font: inherit;
    }

    input[type="text"],
    input[type="number"] {
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    input[type="text"] { flex: 1 1 240px; min-width: 0; }
    input[type="number"] { width: 76px; }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--soft);
    }

    button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 13px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
    }

    button:hover { border-color: var(--primary); }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .primary {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }

    .primary:hover { background: var(--primary-dark); }

    .danger { color: #a33b2f; }

    .segmented {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 7px;
      overflow: hidden;
      background: #fff;
    }

    .segmented button {
      border: 0;
      border-radius: 0;
      min-height: 38px;
    }

    .segmented button.active {
      color: #fff;
      background: var(--primary);
    }

    .controls {
      justify-content: space-between;
      margin: 14px 0;
    }

    .stats {
      color: var(--muted);
      font-size: 14px;
    }

    .stats span {
      min-width: 76px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfa;
      text-align: center;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 8px;
    }

    li {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      min-height: 54px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 8px;
      background: #fff;
    }

    .check {
      width: 28px;
      height: 28px;
      accent-color: var(--primary);
    }

    .task-text {
      overflow-wrap: anywhere;
      line-height: 1.45;
    }

    li.done .task-text {
      color: var(--done);
      text-decoration: line-through;
    }

    li.focused {
      border-color: var(--primary);
      background: var(--soft);
    }

    .icon-btn {
      width: 42px;
      padding: 0;
      text-align: center;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 34px 12px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fbfcfa;
    }

    .timer {
      display: grid;
      gap: 16px;
    }

    .clock {
      width: min(250px, 100%);
      aspect-ratio: 1;
      margin: 4px auto 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: conic-gradient(var(--primary) var(--progress), #e5e9e2 0);
    }

    .clock-inner {
      width: calc(100% - 28px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      text-align: center;
      padding: 18px;
    }

    .time {
      font-size: clamp(42px, 8vw, 58px);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .mode {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .focus-name {
      min-height: 44px;
      color: var(--muted);
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .settings label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 820px) {
      main { width: min(100% - 20px, 620px); padding: 18px 0; }
      header { align-items: start; flex-direction: column; }
      .date { white-space: normal; }
      .layout { grid-template-columns: 1fr; }
      li { grid-template-columns: 34px minmax(0, 1fr) 42px 42px; }
      .controls { align-items: stretch; }
      .segmented { width: 100%; }
      .segmented button { flex: 1; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>待办清单 + 番茄钟</h1>
        <p class="mode">所有访问者共享同一份任务和计时状态</p>
      </div>
      <p class="date" id="today"></p>
    </header>

    <div class="layout">
      <section aria-labelledby="taskTitle">
        <h2 id="taskTitle">今天要做的事</h2>
        <form class="add-row" id="taskForm">
          <input id="taskInput" type="text" maxlength="80" placeholder="输入一个任务" autocomplete="off">
          <button class="primary" type="submit" title="添加任务">＋ 添加</button>
        </form>

        <div class="controls">
          <div class="segmented" aria-label="筛选任务">
            <button type="button" data-filter="all" class="active">全部</button>
            <button type="button" data-filter="active">未完成</button>
            <button type="button" data-filter="done">已完成</button>
          </div>
          <button class="danger" id="clearDone" type="button">清除已完成</button>
        </div>

        <div class="stats" aria-live="polite">
          <span id="totalCount">总计 0</span>
          <span id="doneCount">完成 0</span>
          <span id="leftCount">剩余 0</span>
        </div>

        <ul id="taskList" aria-label="任务列表"></ul>
        <p class="empty" id="emptyState">还没有任务，先写下一件要做的事。</p>
      </section>

      <section class="timer" aria-labelledby="timerTitle">
        <h2 id="timerTitle">番茄钟</h2>
        <div class="segmented" aria-label="计时模式">
          <button type="button" data-mode="work" class="active">专注</button>
          <button type="button" data-mode="break">休息</button>
        </div>

        <div class="clock" id="clock" style="--progress: 0deg">
          <div class="clock-inner">
            <div>
              <div class="time" id="timeText">25:00</div>
              <div class="mode" id="timerMode">专注中</div>
            </div>
          </div>
        </div>

        <p class="focus-name" id="focusName">当前没有选择专注任务</p>

        <div class="timer-actions">
          <button class="primary" id="startPause" type="button">▶ 开始</button>
          <button id="resetTimer" type="button">↺ 重置</button>
          <button id="finishTimer" type="button">✓ 完成一轮</button>
        </div>

        <div class="settings">
          <label>专注 <input id="workMinutes" type="number" min="1" max="120" value="25"> 分钟</label>
          <label>休息 <input id="breakMinutes" type="number" min="1" max="60" value="5"> 分钟</label>
        </div>

        <div class="stats">
          <span id="roundCount">番茄 0</span>
        </div>
      </section>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const supabaseUrl = "https://npknoxfwivyqcbzpxvyt.supabase.co/rest/v1";
    const supabaseKey = "sb_publishable_ziDUBkW8j3N0sUWcutYHDg_tw0hwkjp";
    const stateUrl = `${supabaseUrl}/todo_pomodoro_state`;
    const fallback = { tasks: [], focusId: null, rounds: 0, mode: "work", workMinutes: 25, breakMinutes: 5, timerRunning: false, timerEndAt: null, timerSecondsLeft: null, updatedAt: 0 };
    let state = normalize({ ...fallback });
    let filter = "all";
    let timer = null;
    let syncing = false;

    function normalize(data) {
      data.tasks = Array.isArray(data.tasks) ? data.tasks : [];
      data.workMinutes = clampMinutes(data.workMinutes, 1, 120);
      data.breakMinutes = clampMinutes(data.breakMinutes, 1, 60);
      data.mode = data.mode === "break" ? "break" : "work";
      data.timerRunning = Boolean(data.timerRunning && data.timerEndAt);
      data.timerSecondsLeft = Number.isFinite(data.timerSecondsLeft) ? data.timerSecondsLeft : modeSeconds(data);
      data.updatedAt = Number(data.updatedAt) || (data.tasks.length || data.rounds ? Date.now() : 0);
      return data;
    }

    function save() {
      state.updatedAt = Date.now();
      saveRemote();
    }

    async function saveRemote(force = false) {
      if (location.protocol === "file:" || (syncing && !force)) return;
      try {
        await fetch(stateUrl, {
          method: "POST",
          headers: {
            apikey: supabaseKey,
            Authorization: `Bearer ${supabaseKey}`,
            "Content-Type": "application/json",
            Prefer: "resolution=merge-duplicates,return=minimal"
          },
          body: JSON.stringify({ id: 1, state, updated_at: new Date().toISOString() })
        });
      } catch {}
    }

    async function syncRemote() {
      if (location.protocol === "file:" || syncing) return;
      syncing = true;
      try {
        const response = await fetch(`${stateUrl}?id=eq.1&select=state`, {
          cache: "no-store",
          headers: { apikey: supabaseKey, Authorization: `Bearer ${supabaseKey}` }
        });
        if (!response.ok) return;
        const rows = await response.json();
        const remote = normalize(rows[0]?.state || fallback);
        if (remote.updatedAt > state.updatedAt) {
          state = remote;
          ensureTimer();
          render();
        } else if (state.updatedAt > remote.updatedAt) {
          await saveRemote(true);
        }
      } catch {
      } finally {
        syncing = false;
      }
    }

    function clampMinutes(value, min, max) {
      value = Number(value) || min;
      return Math.min(max, Math.max(min, Math.floor(value)));
    }

    function formatTime(total) {
      const m = String(Math.floor(total / 60)).padStart(2, "0");
      const s = String(total % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    function modeSeconds(data = state) {
      return (data.mode === "break" ? data.breakMinutes : data.workMinutes) * 60;
    }

    function resetSeconds() {
      state.timerRunning = false;
      state.timerEndAt = null;
      state.timerSecondsLeft = modeSeconds();
    }

    function remainingSeconds() {
      if (state.timerRunning && state.timerEndAt) {
        return Math.max(0, Math.ceil((state.timerEndAt - Date.now()) / 1000));
      }
      return state.timerSecondsLeft || modeSeconds();
    }

    function renderTasks() {
      const list = $("taskList");
      const tasks = state.tasks.filter((task) => filter === "all" || (filter === "done") === task.done);
      list.innerHTML = "";
      for (const task of tasks) {
        const li = document.createElement("li");
        li.className = `${task.done ? "done" : ""} ${task.id === state.focusId ? "focused" : ""}`;
        li.innerHTML = `
          <input class="check" type="checkbox" ${task.done ? "checked" : ""} aria-label="切换完成状态">
          <span class="task-text"></span>
          <button class="icon-btn" type="button" title="设为专注任务">◎</button>
          <button class="icon-btn danger" type="button" title="删除任务">×</button>`;
        li.querySelector(".task-text").textContent = task.text;
        li.querySelector("input").onchange = () => { task.done = !task.done; save(); render(); };
        li.querySelectorAll("button")[0].onclick = () => { state.focusId = task.id; save(); render(); };
        li.querySelectorAll("button")[1].onclick = () => {
          state.tasks = state.tasks.filter((item) => item.id !== task.id);
          if (state.focusId === task.id) state.focusId = null;
          save(); render();
        };
        list.appendChild(li);
      }
      $("emptyState").hidden = tasks.length > 0;
    }

    function renderStats() {
      const total = state.tasks.length;
      const done = state.tasks.filter((task) => task.done).length;
      $("totalCount").textContent = `总计 ${total}`;
      $("doneCount").textContent = `完成 ${done}`;
      $("leftCount").textContent = `剩余 ${total - done}`;
      $("roundCount").textContent = `番茄 ${state.rounds}`;
    }

    function renderTimer() {
      const secondsLeft = remainingSeconds();
      const total = modeSeconds();
      const passed = total ? total - secondsLeft : 0;
      $("timeText").textContent = formatTime(secondsLeft);
      $("timerMode").textContent = state.mode === "break" ? "休息中" : "专注中";
      $("clock").style.setProperty("--progress", `${Math.round(passed / total * 360)}deg`);
      $("startPause").textContent = state.timerRunning ? "Ⅱ 暂停" : "▶ 开始";
      $("workMinutes").value = state.workMinutes;
      $("breakMinutes").value = state.breakMinutes;
      document.querySelectorAll("[data-mode]").forEach((btn) => btn.classList.toggle("active", btn.dataset.mode === state.mode));
      const focus = state.tasks.find((task) => task.id === state.focusId);
      $("focusName").textContent = focus ? `当前专注：${focus.text}` : "当前没有选择专注任务";
    }

    function render() {
      renderTasks();
      renderStats();
      renderTimer();
    }

    function stopTimer() {
      clearInterval(timer);
      timer = null;
    }

    function ensureTimer() {
      stopTimer();
      if (state.timerRunning && remainingSeconds() <= 0) {
        finishRound();
        return;
      }
      if (!state.timerRunning) return;
      timer = setInterval(tickTimer, 1000);
    }

    function tickTimer() {
      if (remainingSeconds() <= 0) finishRound();
      else renderTimer();
    }

    function beep() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      gain.gain.value = 0.06; osc.frequency.value = 880;
      osc.start(); osc.stop(ctx.currentTime + 0.18);
    }

    function finishRound() {
      stopTimer();
      if (state.mode === "work") state.rounds += 1;
      state.mode = state.mode === "work" ? "break" : "work";
      resetSeconds();
      save(); beep(); render();
    }

    $("today").textContent = new Date().toLocaleDateString("zh-CN", { weekday: "long", year: "numeric", month: "long", day: "numeric" });

    $("taskForm").onsubmit = (event) => {
      event.preventDefault();
      const text = $("taskInput").value.trim();
      if (!text) return;
      state.tasks.unshift({ id: crypto.randomUUID(), text, done: false });
      $("taskInput").value = "";
      save(); render();
    };

    document.querySelectorAll("[data-filter]").forEach((button) => {
      button.onclick = () => {
        filter = button.dataset.filter;
        document.querySelectorAll("[data-filter]").forEach((btn) => btn.classList.toggle("active", btn === button));
        renderTasks();
      };
    });

    document.querySelectorAll("[data-mode]").forEach((button) => {
      button.onclick = () => {
        stopTimer();
        state.mode = button.dataset.mode;
        resetSeconds();
        save(); render();
      };
    });

    $("clearDone").onclick = () => {
      const doneIds = new Set(state.tasks.filter((task) => task.done).map((task) => task.id));
      state.tasks = state.tasks.filter((task) => !task.done);
      if (doneIds.has(state.focusId)) state.focusId = null;
      save(); render();
    };

    $("startPause").onclick = () => {
      if (state.timerRunning) {
        state.timerSecondsLeft = remainingSeconds();
        state.timerRunning = false;
        state.timerEndAt = null;
        stopTimer();
        save(); renderTimer();
        return;
      }
      state.timerSecondsLeft = remainingSeconds();
      state.timerRunning = true;
      state.timerEndAt = Date.now() + state.timerSecondsLeft * 1000;
      ensureTimer();
      save(); renderTimer();
    };

    $("resetTimer").onclick = () => { stopTimer(); resetSeconds(); save(); render(); };
    $("finishTimer").onclick = finishRound;

    $("workMinutes").onchange = () => { state.workMinutes = clampMinutes($("workMinutes").value, 1, 120); stopTimer(); resetSeconds(); save(); render(); };
    $("breakMinutes").onchange = () => { state.breakMinutes = clampMinutes($("breakMinutes").value, 1, 60); stopTimer(); resetSeconds(); save(); render(); };

    ensureTimer();
    render();
    syncRemote();
    setInterval(syncRemote, 2000);
  </script>
</body>
</html>
